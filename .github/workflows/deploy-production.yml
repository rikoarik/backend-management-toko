name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, curl, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare deployment files
        run: |
          # Remove files yang tidak perlu di-deploy
          rm -rf .git
          rm -rf .github
          rm -rf tests
          rm -rf node_modules
          rm -f .env
          rm -f .env.example
          rm -f .gitignore
          rm -f .gitattributes
          rm -f phpunit.xml
          rm -f README.md

      - name: Deploy to Production via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          server-dir: ${{ secrets.FTP_DIR_PROD }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.example

      - name: Notify success
        if: success()
        run: echo "✅ Deployment to production successful!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment to production failed!"
