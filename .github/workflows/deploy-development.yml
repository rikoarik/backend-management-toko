name: Deploy to Development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, curl, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Clear Laravel caches before packaging
        run: |
          php artisan optimize:clear
          php artisan config:clear

      - name: Prepare deployment files
        run: |
          # Remove files yang tidak perlu di-deploy
          rm -rf .git
          rm -rf .github
          rm -rf tests
          rm -rf node_modules
          rm -f .env
          rm -f .env.example
          rm -f .gitignore
          rm -f .gitattributes
          rm -f phpunit.xml
          rm -f README.md

      - name: Deploy to Development via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          server-dir: ${{ secrets.FTP_DIR_DEV }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.example

      - name: Run Migrations & Clear Cache
        run: |
          echo "Running migration on development server..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            "${{ secrets.DEV_URL }}/deploy-migrate.php")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Migration failed!"
            exit 1
          fi
          
          echo "✅ Migration completed successfully!"

      - name: Verify deployed app health
        run: |
          echo "Checking /up endpoint..."
          curl --fail --silent --show-error "${{ secrets.DEV_URL }}/up" > /dev/null

          echo "Checking /api/health endpoint..."
          curl --fail --silent --show-error "${{ secrets.DEV_URL }}/api/health" > /dev/null

          echo "✅ Health checks passed!"

      - name: Notify success
        if: success()
        run: echo "✅ Deployment to development successful!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment to development failed!"


